services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signalbridge
      POSTGRES_USER: signalbridge
      POSTGRES_PASSWORD: signalbridge
    ports:
      - "5432:5432"
    volumes:
      - signalbridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbridge -d signalbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  signalbridge_postgres_data:
